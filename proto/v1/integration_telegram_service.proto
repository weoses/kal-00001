syntax = "proto3";
import "proto/v1/auth_common.proto";

option go_package = "github.com/weoses/memelo/gen/proto/v1";
package proto.memelo.v1;

message TelegramAuthorizeRequest {
  int64 telegram_id = 1;
}

message TelegramAuthorizeResponse {
  AuthResult result = 1;
}

service IntegrationTelegramService {
  rpc Authorize(TelegramAuthorizeRequest) returns (TelegramAuthorizeResponse);
}

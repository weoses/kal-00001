---
- name: Ensure deploy directory exists
  file:
    path: "{{ deploy_path }}"
    state: directory
    mode: "0755"

- name: Clone repository if not present
  git:
    repo: "{{ repo_url }}"
    dest: "{{ deploy_path }}"
    version: "{{ commit_hash }}"
    force: true
  register: git_result

- name: Template postgres init script
  template:
    src: postgres-init-create-dbs.sql.j2
    dest: "{{ deploy_path }}/postgres-init/001-create-databases.sql"
    mode: "0644"

- name: Template auth-service config file
  template:
    src: auth-service-config.yaml.j2
    dest: "{{ deploy_path }}/auth-service-config.yaml"
    mode: "0600"

- name: Template ffmpeg-service config file
  template:
    src: ffmpeg-service-config.yaml.j2
    dest: "{{ deploy_path }}/ffmpeg-service-config.yaml"
    mode: "0600"

- name: Template storage-service config file
  template:
    src: storage-service-config.yaml.j2
    dest: "{{ deploy_path }}/storage-service-config.yaml"
    mode: "0600"

- name: Template telegram-service config file
  template:
    src: telegram-service-config.yaml.j2
    dest: "{{ deploy_path }}/telegram-service-config.yaml"
    mode: "0600"

- name: Template webapp-service config file
  template:
    src: webapp-service-config.yaml.j2
    dest: "{{ deploy_path }}/webapp-service-config.yaml"
    mode: "0600"

- name: Template youtube-service config file
  template:
    src: youtube-service-config.yaml.j2
    dest: "{{ deploy_path }}/youtube-service-config.yaml"
    mode: "0600"

- name: Template docker-compose file
  template:
    src: docker-compose.deploy.yml.j2
    dest: "{{ deploy_path }}/docker-compose.deploy.yml"
    mode: "0644"

- name: Stop and remove existing containers
  community.docker.docker_compose_v2:
    project_src: "{{ deploy_path }}"
    files:
      - docker-compose.deploy.yml
    project_name: memelo
    state: absent
    remove_orphans: true
  ignore_errors: true

- name: Pull images and start services
  community.docker.docker_compose_v2:
    project_src: "{{ deploy_path }}"
    files:
      - docker-compose.deploy.yml
    project_name: memelo
    state: present
    pull: always
    wait: true
    wait_timeout: 300
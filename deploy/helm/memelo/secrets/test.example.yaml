# Template for secrets/test.yaml / secrets/production.yaml.
#
# This file documents the full shape of `.Values.secrets` consumed by the
# chart's config templates (templates/_configs.tpl). It is NOT sops-encrypted
# itself — copy it, fill in real values, then encrypt with sops before it's
# used or committed. See secrets/README.md for the full workflow.
secrets:
  # --- Postgres (auth-service, telegram-service) ---
  # External Postgres instance; this chart does not deploy Postgres itself.
  postgresHost: ""
  postgresUser: ""
  postgresPassword: ""

  # --- S3 / media storage (storage-service, telegram-service, youtube-service, ffmpeg-service) ---
  s3AccessKey: ""
  s3SecretKey: ""

  # --- Elasticsearch (storage-service) ---
  elasticCloudId: ""
  elasticApiKey: ""

  # --- LLM providers (storage-service) ---
  geminiApiKey: ""
  openrouterApiKey: ""

  # --- Telegram (telegram-service) ---
  telegramToken: ""  # bot token from @BotFather

  # --- Webapp (webapp-service) ---
  webappAccountId: ""  # account id the webapp operates as
  webappJwtSecret: ""  # signing secret for webapp JWTs

  # --- YouTube (youtube-service) ---
  youtubeProviderApiKey: ""  # API key for the youtube download provider
